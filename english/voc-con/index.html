      /*チェックボックスを非表示*/
      input[type="checkbox"]{
        display: none;
      }

      /*答えを白文字にして隠しておく*/
      .A {
        color: #FFFFFF;
      }
      /*チェックボックスにチェックが入った時、答えを黒文字にして表示する*/
      input[type="checkbox"]:checked + .A {
        color:#000000;
      }

      /*表の書式設定*/
      table {
        border-collapse: collapse;
      }
      td {
        border: solid #000000 1px;
      }
      .ans {
        width: 60dvw;  /*答えの列を画面幅の60％に設定*/
