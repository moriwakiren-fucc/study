<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>URLを開く</title>
    <script>
        function openUrl() {
            // 入力欄の値を取得
            const inputUrl = document.getElementById('urlInput').value;
            const url = 'https://moriwakiren-fucc.github.io/study/' + inputUrl + '.pdf'
            // 入力が空でないかチェック
            if (url) {
                // 別タブでURLを開く
                window.open(url, '_blank');
            } else {
                alert('URLを入力してください。');
            }
        }
    </script>
</head>
<body>
    <form onsubmit="event.preventDefault(); openUrl();">
        <label for="urlInput">URL:</label>
        <input type="text" id="urlInput" placeholder="パスワードを入力" required>
        <button type="submit">開く</button>
    </form>
</body>
</html>
