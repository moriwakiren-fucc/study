<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>📐 Geminiの脳みそを借りるサイト (理系数学版)</title>
    
    <!-- マークダウン解析用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- 数式(LaTeX)描画用ライブラリ(MathJax) -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --sidebar-bg: #f0f2f6;
            --text-color: #31333f;
            --border-color: #dcdcdc;
            --primary-color: #ff4b4b;
            --user-msg-bg: #e8f0fe;
            --bot-msg-bg: #f9f9f9;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Meiryo, system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            display: flex;
            height: 100dvh;
            color: var(--text-color);
            background-color: var(--bg-color);
            overflow: hidden;
        }

        /* ----- サイドバー ----- */
        .sidebar {
            width: 330px;
            background-color: var(--sidebar-bg);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
            position: relative;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="password"],
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 0.95rem;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: white;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        button:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        button.primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
        }
        
        button.primary:hover {
            background-color: #ff3333;
            color: white;
        }

        /* ----- メインコンテンツ ----- */
        .main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100dvh;
        }

        .header {
            flex-shrink: 0;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        /* チャット表示エリア */
        .chat-container {
            flex-grow: 1;
            padding: 20px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 15px;
            max-width: 800px;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .user .avatar { background-color: #007bff; color: white; }
        .assistant .avatar { background-color: #28a745; color: white; }

        .message-content {
            padding: 15px;
            border-radius: 10px;
            font-size: 1rem;
            line-height: 1.6;
            overflow-x: auto;
        }

        .user .message-content {
            background-color: var(--user-msg-bg);
            border: 1px solid #d0e1fd;
        }

        .assistant .message-content {
            background-color: var(--bot-msg-bg);
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .error-box {
            background-color: #fde8e8;
            border-left: 4px solid #f44336;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #d32f2f;
        }

        /* ----- チャット入力エリア ----- */
        .chat-input-wrapper {
            flex-shrink: 0;
            padding: 20px 40px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group textarea {
            flex-grow: 1;
            height: 50px;
            resize: none;
        }

        .input-group button {
            width: 100px;
        }
    </style>
</head>
<body>

    <!-- サイドバー -->
    <div class="sidebar">
        <h2>⚙️ 設定</h2>
        <div class="form-group">
            <label for="api-key">Gemini API Key</label>
            <input type="password" id="api-key" placeholder="AIzaSy...">
        </div>
        <div class="form-group">
            <label for="model-select">モデル選択</label>
            <select id="model-select">
                <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                <option value="gemini-2.5-pro">gemini-2.5-pro</option>
            </select>
        </div>
    </div>

    <!-- メイン -->
    <div class="main">
        <div class="header">
            <h1>📐 Geminiの脳みそを借りるサイト</h1>
        </div>

        <!-- チャットエリア -->
        <div class="chat-container" id="chat-container">
            <div class="message assistant">
                <div class="avatar">🤖</div>
                <div class="message-content">こんにちは！理系数学の質問を何でも聞いてください。数式（LaTeX）の表示にも対応しています。</div>
            </div>
        </div>

        <!-- 入力エリア -->
        <div class="chat-input-wrapper">
            <div class="input-group">
                <textarea id="user-input" placeholder="質問を入力してください（例: 二次関数の最大値の求め方は？）"></textarea>
                <button id="send-btn" class="primary">送信</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const apiKeyInput = document.getElementById('api-key');
        const modelSelect = document.getElementById('model-select');

        // ローカルストレージからAPIキーを復元
        if (localStorage.getItem('gemini_api_key')) {
            apiKeyInput.value = localStorage.getItem('gemini_api_key');
        }

        // APIキーの変更を保存
        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        });

        // メッセージを画面に追加する関数
        function appendMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerText = sender === 'user' ? '👤' : '🤖';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            // 初期のテキスト配置（ユーザー用、またはAIの枠確保）
            if (sender === 'user') {
                content.innerText = text;
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return content; // AI用には中身のDOMエレメントを返す
        }

        // 送信処理
        async function handleSend() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            const model = modelSelect.value;

            if (!text) return;
            if (!apiKey) {
                alert('APIキーを入力してください。');
                return;
            }

            // 1. ユーザーの入力を画面に出す
            appendMessage('user', text);
            userInput.value = '';

            // 2. AIの応答枠（ローディング用）を作成
            const botContentEl = appendMessage('assistant', '');
            botContentEl.innerText = '思考中...';

            // 3. 5分のタイムアウト（AbortController）の設定
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 300000); // 300,000ms = 5分

            // ストリーミング用エンドポイントURL
            const url = `https://googleapis.com{model}:streamGenerateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: text }] }]
            };

            let fullResponseText = "";

            try {
                sendBtn.disabled = true;
const response = await fetch(url, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload),
signal: controller.signal
});
if (!response.ok) {
throw new Error(HTTPエラー! ステータス: ${response.status});
}
// 4. ストリーミングデータの読み込み開始
botContentEl.innerText = ''; // 「思考中...」を消す
const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
let buffer = "";
while (true) {
const { value, done } = await reader.read();
if (done) break;
buffer += value;
const lines = buffer.split('\n');
buffer = lines.pop(); // 未完成の最後の行を次回に持ち越し
for (const line of lines) {
const cleanedLine = line.trim();
if (!cleanedLine || !cleanedLine.startsWith('data:')) continue;
const jsonStr = cleanedLine.replace(/^data:\s*/, '');
try {
const parsed = JSON.parse(jsonStr);
const textChunk = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
if (textChunk) {
fullResponseText += textChunk;
// マークダウンを解析してリアルタイムに反映
botContentEl.innerHTML = marked.parse(fullResponseText);
chatContainer.scrollTop = chatContainer.scrollHeight;
}
} catch (e) {
// パース失敗時はスキップして次のバッファを待つ
}
}
}
// 5. ストリーミング完了後にMathJaxで数式を一斉描画
if (window.MathJax && window.MathJax.typesetPromise) {
window.MathJax.typesetPromise([botContentEl]).catch((err) => console.log(err));
}
} catch (error) {
console.error(error);
if (error.name === 'AbortError') {
botContentEl.innerHTML = <div class="error-box">⚠️ 5分の最大制限時間に達したため、処理が中断されました。</div>;
} else {
botContentEl.innerHTML = <div class="error-box">⚠️ エラーが発生しました: ${error.message}</div>;
}
} finally {
clearTimeout(timeoutId); // タイマー解除
sendBtn.disabled = false;
}
}
// ボタンクリックとEnterキーでの送信イベント
sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e) => {
if (e.key === 'Enter' && !e.shiftKey) {
e.preventDefault();
handleSend();
}
});
