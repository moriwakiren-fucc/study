<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>💬 Geminiの脳みそを借りるサイト</title>
    
    <!-- マークダウン解析用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Google Identity Services（Googleログイン & Drive保存用） -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- 数式レンダリング用ライブラリ (MathJax) -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --sidebar-bg: #f7f9fc;
            --text-color: #202124;
            --border-color: #e3e3e3;
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --user-msg-bg: #e8f0fe;
            --bot-msg-bg: #f8f9fa;
            --danger-color: #d93025;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Meiryo, system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            display: flex;
            height: 100dvh;
            color: var(--text-color);
            background-color: var(--bg-color);
            overflow: hidden;
        }

        /* ----- サイドバー ----- */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
            position: relative;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar h2 {
            font-size: 1.1rem;
            margin: 0 0 15px 0;
        }

        .form-group { margin-bottom: 15px; }
        .flex-group { display: flex; gap: 5px; }
        
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: bold;
            color: #5f6368;
        }

        input[type="password"],
        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            gap: 5px;
            margin-bottom: 15px;
            color: #5f6368;
        }

        button.btn {
            width: 100%;
            padding: 8px;
            background-color: white;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        button.btn:hover { background-color: #f1f3f4; }
        
        button.btn.primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        button.btn.primary:hover { background-color: var(--primary-hover); }

        /* ----- Googleアカウント & クラウド同期 ----- */
        .account-box {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .account-signed-out, .account-signed-in {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .account-signed-in { display: none; }
        .account-box.signed-in .account-signed-out { display: none; }
        .account-box.signed-in .account-signed-in { display: flex; }

        .account-avatar-img {
            width: 28px; height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .account-email {
            font-size: 0.8rem;
            color: #5f6368;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }

        .signout-btn {
            background: none; border: none;
            font-size: 0.78rem;
            color: var(--primary-color);
            cursor: pointer;
            flex-shrink: 0;
            padding: 4px;
        }
        .signout-btn:hover { text-decoration: underline; }

        .sync-status {
            font-size: 0.75rem;
            color: #9aa0a6;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            min-height: 16px;
        }
        .sync-status.syncing { color: var(--primary-color); }
        .sync-status.error { color: var(--danger-color); }

        /* 履歴リスト */
        .history-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .history-container h3 {
            font-size: 0.85rem;
            color: #5f6368;
            margin: 10px 10px;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .history-item:hover { background-color: #e8eaed; }
        .history-item.active {
            background-color: #e8f0fe;
            color: var(--primary-color);
            font-weight: bold;
        }

        .history-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }

        .delete-history-btn {
            background: none;
            border: none;
            color: #9aa0a6;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
        }
        .delete-history-btn:hover { color: var(--danger-color); }
        .delete-history-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .close-sidebar-btn {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #5f6368;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        /* ----- メインコンテンツ ----- */
        .main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100dvh;
        }

        .header {
            flex-shrink: 0;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            margin-right: 15px;
            color: #5f6368;
        }

        .header h1 { margin: 0; font-size: 1.3rem; }

        /* チャット表示エリア */
        .chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message { display: flex; gap: 15px; max-width: 850px; margin: 0 auto; width: 100%; }
        .message.user { flex-direction: row-reverse; }

        .avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
        }
        .user .avatar { background-color: var(--primary-color); color: white; }
        .assistant .avatar { background-color: #10a37f; color: white; }

        .message-content {
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.6;
            overflow-x: auto;
            max-width: calc(100% - 50px);
        }

        .user .message-content {
            background-color: var(--user-msg-bg);
            border: 1px solid #d0e1fd;
        }
        .assistant .message-content {
            background-color: var(--bot-msg-bg);
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .message-content p:first-child { margin-top: 0; }
        .message-content p:last-child { margin-bottom: 0; }
        
        .message-content pre {
            background: #282c34; color: #abb2bf;
            padding: 10px; border-radius: 5px; overflow-x: auto;
        }

        .message-content img.attached-image {
            max-width: 300px;
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .info-box {
            background-color: #e8f4fd; border-left: 4px solid var(--primary-color);
            padding: 15px; border-radius: 4px; margin: 20px auto; max-width: 600px;
        }
        .error-box {
            background-color: #fde8e8; border-left: 4px solid var(--danger-color);
            padding: 15px; border-radius: 4px; margin-top: 10px; font-size: 0.9rem;
        }

        /* ----- チャット入力エリア ----- */
        .chat-input-wrapper {
            flex-shrink: 0;
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }

        .chat-input-form {
            display: flex;
            flex-direction: column;
            max-width: 850px;
            margin: 0 auto;
            position: relative;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        
        .chat-input-form:focus-within { border-color: var(--primary-color); }

        /* 画像プレビューエリア */
        .preview-area {
            display: none;
            padding: 10px 15px 0;
        }
        .preview-item {
            position: relative;
            display: inline-block;
        }
        .preview-item img {
            height: 60px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .preview-item .remove-btn {
            position: absolute;
            top: -5px; right: -5px;
            background: #5f6368; color: white;
            border: none; border-radius: 50%;
            width: 20px; height: 20px;
            font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            padding: 8px;
        }

        .attach-btn {
            background: none; border: none; cursor: pointer;
            padding: 8px; color: #5f6368; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; flex-shrink: 0;
        }
        .attach-btn:hover { background: #f1f3f4; color: var(--text-color); }
        .attach-btn svg { width: 22px; height: 22px; fill: currentColor; }

        .chat-input-form textarea {
            border: none; outline: none;
            padding: 10px; flex-grow: 1;
            resize: none; font-size: 1rem;
            line-height: 1.5; min-height: 44px; max-height: 200px;
            background: transparent;
        }

        .send-btn {
            background: var(--primary-color); border: none;
            color: white; cursor: pointer;
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; flex-shrink: 0; margin-bottom: 4px; margin-right: 4px;
        }
        .send-btn:hover { background: var(--primary-hover); }
        .send-btn:disabled { background: #e3e3e3; cursor: not-allowed; }
        .send-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .spinner {
            border: 3px solid rgba(0,0,0,0.1); border-radius: 50%;
            border-top: 3px solid var(--primary-color);
            width: 18px; height: 18px;
            animation: spin 1s linear infinite; display: inline-block;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* モバイル対応 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; height: 100dvh; left: 0; top: 0;
                transform: translateX(-100%); width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            .menu-btn { display: block; }
            .close-sidebar-btn { display: block; }
            .message { gap: 10px; }
            .avatar { width: 30px; height: 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- サイドバー -->
    <div class="sidebar" id="sidebar">
        <button class="close-sidebar-btn" id="close-sidebar-btn">&times;</button>
        
        <div class="account-box" id="account-box">
            <div class="account-signed-out">
                <div id="google-signin-btn"></div>
            </div>
            <div class="account-signed-in">
                <img class="account-avatar-img" id="account-avatar" src="" alt="">
                <span class="account-email" id="account-email"></span>
                <button class="signout-btn" id="signout-btn">ログアウト</button>
            </div>
            <div class="sync-status" id="sync-status"></div>
        </div>

        <div class="sidebar-header">
            <button class="btn primary" id="new-chat-btn">
                <svg style="width:18px;height:18px;fill:white;" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                新しいチャット
            </button>
            
            <h2>⚙️ 設定</h2>
            <div class="form-group flex-group">
                <input type="password" id="api-key-input" placeholder="APIキーを入力" style="flex-grow: 1;">
                <select id="api-key-dropdown" style="width: 80px;" title="保存されたAPIキー">
                    <option value="">読込▼</option>
                </select>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="show-key-checkbox">
                <label for="show-key-checkbox" style="margin:0;">APIキーを表示</label>
            </div>
            <div class="form-group">
                <button type="button" class="btn" id="save-key-btn">キーを保存</button>
            </div>
            
            <div class="form-group" style="margin-bottom:0;">
                <label>モデル選択</label>
                <select id="model-select">
                    <option value="gemini-3.5-flash">gemini-3.5-flash (高速・標準)</option>
                    <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview (高性能)</option>
                    <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (軽量)</option>
                </select>
            </div>
        </div>

        <p style="font-size: 0.8rem; margin: 10px 20px; line-height: 1.6;">
            <a href="index.html" style="color: var(--primary-color); text-decoration: none;">理系数学版</a><br>
            <a href="bunkei.html" style="color: var(--primary-color); text-decoration: none;">文系数学版</a>
        </p>

        <div class="history-container">
            <h3>📝 チャット履歴</h3>
            <ul class="history-list" id="history-list">
                <!-- 履歴アイテムがここに追加されます -->
            </ul>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="main">
        <div class="header">
            <button class="menu-btn" id="menu-btn">☰</button>
            <h1>💬 Geminiの脳みそを借りるサイト</h1>
        </div>

        <div class="chat-container" id="chat-container">
            <div class="info-box" id="initial-info">
                <strong>Geminiの脳みそを借りるサイトへようこそ！</strong><br><br>
                1. 左側のサイドバーに <strong>Gemini APIキー</strong> を入力してください。<br>
                2. 下の入力欄からメッセージを送信すると対話がスタートします。<br>
                3. クリップのアイコンから<strong>画像を添付</strong>して質問することも可能です。<br><br>
                ※左上で<strong>Googleログイン</strong>すると、チャット履歴があなたのGoogleドライブ（アプリ専用領域）に自動保存され、他の端末とも同期されます。ログインしない場合は、この端末のブラウザ内にのみ一時的に保存されます（容量に上限があります）。
            </div>
        </div>

        <div class="chat-input-wrapper">
            <form id="chat-input-form" class="chat-input-form">
                
                <!-- 画像プレビュー -->
                <div class="preview-area" id="preview-area">
                    <div class="preview-item">
                        <img id="preview-img" src="" alt="添付画像">
                        <button type="button" class="remove-btn" id="remove-img-btn">&times;</button>
                    </div>
                </div>

                <div class="input-row">
                    <!-- 隠しファイル入力 -->
                    <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg, image/webp" style="display: none;">
                    
                    <button type="button" class="attach-btn" id="attach-btn" title="画像を添付">
                        <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v11.5a2.5 2.5 0 0 0 5 0V5c0-1.93-1.57-3.5-3.5-3.5S8 3.07 8 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-2.5z"/></svg>
                    </button>
                    
                    <textarea id="chat-input" rows="1" placeholder="メッセージを入力... (Ctrl+Enterで送信)"></textarea>
                    
                    <button type="submit" id="chat-send-btn" class="send-btn" disabled title="送信 (Ctrl+Enter)">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SYSTEM_INSTRUCTION = "あなたは親切で有能なAIアシスタントです。ユーザーの質問や指示に丁寧に答えてください。";

        // ----- Google Drive 同期設定 -----
        const GOOGLE_CLIENT_ID = "86513628730-q8nfg0e77u0ffgji1tem8ikt9ihvp8no.apps.googleusercontent.com";
        // appDataFolder: ユーザーには見えないアプリ専用の隠しフォルダ（ドライブ本体を汚さない）
        const GOOGLE_DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
        const DRIVE_FILE_NAME = "gemini_chat_histories.json";
        const DRIVE_KEYS_FILE_NAME = "gemini_api_keys.json"; // APIキーは履歴と分離した別ファイルで同期

        let googleAccessToken = null;   // Drive APIアクセス用トークン（メモリ上のみ、保存しない）
        let googleTokenClient = null;   // GISのトークンクライアント
        let driveFileIds = {};          // ファイル名 -> Drive上のファイルID のキャッシュ（複数ファイル対応）
        let isSignedIn = false;
        let isSyncing = false;
        let pendingCloudSave = false;   // 同期中に追加の保存要求が来た場合のフラグ
        const LAST_SIGNIN_KEY = 'gemini_last_signed_in'; // 前回ログイン済みだったかの記録（トークン自体は保存しない）

        // UI要素
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const menuBtn = document.getElementById('menu-btn');
        const closeSidebarBtn = document.getElementById('close-sidebar-btn');
        const newChatBtn = document.getElementById('new-chat-btn');
        const historyListEl = document.getElementById('history-list');

        const apiKeyInput = document.getElementById('api-key-input');
        const apiKeyDropdown = document.getElementById('api-key-dropdown');
        const showKeyCheckbox = document.getElementById('show-key-checkbox');
        const saveKeyBtn = document.getElementById('save-key-btn');
        const modelSelect = document.getElementById('model-select');
        
        const accountBox = document.getElementById('account-box');
        const googleSigninBtnEl = document.getElementById('google-signin-btn');
        const accountAvatar = document.getElementById('account-avatar');
        const accountEmail = document.getElementById('account-email');
        const signoutBtn = document.getElementById('signout-btn');
        const syncStatusEl = document.getElementById('sync-status');

        const initialInfo = document.getElementById('initial-info');
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const chatSendBtn = document.getElementById('chat-send-btn');
        const chatInputForm = document.getElementById('chat-input-form');
        
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const previewArea = document.getElementById('preview-area');
        const previewImg = document.getElementById('preview-img');
        const removeImgBtn = document.getElementById('remove-img-btn');

        // 状態管理
        let currentSessionId = null;
        let currentMessages = []; // { role: 'user'|'model', text: '...', imageUrl: '...' }
        let attachedImageData = null; // { base64, mimeType, dataUrl }

        // --- サイドバー開閉 ---
        function openSidebar() { sidebar.classList.add('open'); sidebarOverlay.classList.add('open'); }
        function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); }
        menuBtn.addEventListener('click', openSidebar);
        closeSidebarBtn.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);

        // ==================================================
        // --- Googleログイン & Google Drive 同期処理 ---
        // ==================================================

        function setSyncStatus(text, mode) {
            syncStatusEl.textContent = text || '';
            syncStatusEl.className = 'sync-status' + (mode ? ' ' + mode : '');
        }

        // Google Identity Servicesの初期化（ライブラリの読み込み完了を待つ）
        function initGoogleAuthWhenReady() {
            if (typeof google === 'undefined' || !google.accounts) {
                setTimeout(initGoogleAuthWhenReady, 200);
                return;
            }

            // 「Sign in with Google」ボタン（ID Token取得用。ユーザー表示名/メール/アイコン取得のため）
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleIdTokenResponse,
            });
            google.accounts.id.renderButton(googleSigninBtnEl, {
                theme: 'outline',
                size: 'medium',
                text: 'signin_with',
                shape: 'pill',
            });

            // Driveアクセス用のOAuthトークンクライアント（別途アクセストークンが必要）
            googleTokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: GOOGLE_DRIVE_SCOPE,
                callback: handleAccessTokenResponse,
            });

            // 前回ログイン済みだった場合、ユーザー操作なしで裏側からサイレント再認証を試みる
            if (localStorage.getItem(LAST_SIGNIN_KEY) === 'true') {
                setSyncStatus('自動ログインを試みています...', 'syncing');
                // prompt:'' により、Googleのセッションが有効ならポップアップ無しでトークンを取得できる
                // （ブラウザのポップアップブロック回避のため、少し遅延させて呼び出す）
                setTimeout(() => {
                    googleTokenClient.requestAccessToken({ prompt: '' });
                }, 300);
            }
        }

        // 「Sign in with Google」ボタンが押されたときの処理（プロフィール情報の取得）
        function handleGoogleIdTokenResponse(response) {
            try {
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                accountEmail.textContent = payload.email || '';
                accountAvatar.src = payload.picture || '';
                accountBox.classList.add('signed-in');
            } catch (e) {
                console.error('Googleプロフィールの解析に失敗:', e);
            }

            // プロフィール表示に続けて、Drive操作用のアクセストークンを要求
            googleTokenClient.requestAccessToken({ prompt: '' });
        }

        // Driveアクセストークンが取得できたときの処理
        async function handleAccessTokenResponse(tokenResponse) {
            if (tokenResponse.error) {
                // サイレント認証が失敗した場合（Googleセッション切れ等）は、
                // 静かに諦めて通常のログインボタン操作を待つ
                localStorage.removeItem(LAST_SIGNIN_KEY);
                setSyncStatus('', null);
                return;
            }
            googleAccessToken = tokenResponse.access_token;
            isSignedIn = true;
            localStorage.setItem(LAST_SIGNIN_KEY, 'true');

            // プロフィール（メール・アイコン）がまだ表示されていない場合は取得する
            if (!accountBox.classList.contains('signed-in')) {
                try {
                    const profileRes = await fetch(
                        'https://www.googleapis.com/oauth2/v3/userinfo',
                        { headers: { Authorization: `Bearer ${googleAccessToken}` } }
                    );
                    if (profileRes.ok) {
                        const profile = await profileRes.json();
                        accountEmail.textContent = profile.email || '';
                        accountAvatar.src = profile.picture || '';
                        accountBox.classList.add('signed-in');
                    }
                } catch (e) {
                    console.warn('プロフィール取得に失敗:', e);
                }
            }

            setSyncStatus('クラウドの履歴を読み込み中...', 'syncing');
            try {
                const cloudSessions = await loadHistoriesFromDrive();
                // クラウド側のデータで表示を更新（クラウドが正）
                localStorage.setItem('gemini_chat_histories', JSON.stringify(cloudSessions));
                renderHistoryList();

                // APIキーはこの端末のローカルキーとクラウド側をマージ（どちらの端末で登録したキーも失わない）
                const cloudKeys = await loadApiKeysFromDrive();
                const localKeys = JSON.parse(localStorage.getItem('gemini_api_keys') || '[]');
                const mergedKeys = Array.from(new Set([...localKeys, ...cloudKeys]));
                localStorage.setItem('gemini_api_keys', JSON.stringify(mergedKeys));
                updateApiKeyDropdown();
                if (mergedKeys.length > 0 && !apiKeyInput.value.trim()) {
                    apiKeyInput.value = mergedKeys[mergedKeys.length - 1];
                }
                // マージ結果をクラウドにも書き戻しておく（他端末のキーが今後もこの端末に残るように）
                if (mergedKeys.length !== cloudKeys.length) {
                    await saveApiKeysToDrive(mergedKeys);
                }

                setSyncStatus('クラウドと同期済み', null);
            } catch (e) {
                console.error(e);
                setSyncStatus('クラウド読み込みに失敗しました。', 'error');
            }
        }

        // ---- Drive appDataFolder 内のファイル探索（fileNameごとにID をキャッシュ） ----
        async function findDriveFileId(fileName) {
            if (driveFileIds[fileName]) return driveFileIds[fileName];

            const url = 'https://www.googleapis.com/drive/v3/files'
                + '?spaces=appDataFolder'
                + '&fields=files(id,name)'
                + '&q=' + encodeURIComponent(`name='${fileName}'`);

            const res = await fetch(url, {
                headers: { Authorization: `Bearer ${googleAccessToken}` }
            });
            if (!res.ok) throw new Error('Drive検索に失敗しました。');
            const data = await res.json();

            if (data.files && data.files.length > 0) {
                driveFileIds[fileName] = data.files[0].id;
            } else {
                driveFileIds[fileName] = null;
            }
            return driveFileIds[fileName];
        }

        // ---- Driveからjsonデータを読み込み（汎用） ----
        async function loadJsonFromDrive(fileName, fallback) {
            const fileId = await findDriveFileId(fileName);
            if (!fileId) return fallback; // まだ保存したことがない場合

            const res = await fetch(
                `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
                { headers: { Authorization: `Bearer ${googleAccessToken}` } }
            );
            if (!res.ok) throw new Error('Driveからの読み込みに失敗しました。');
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                return fallback;
            }
        }

        // ---- Driveへjsonデータを保存（新規作成 or 上書き更新、汎用） ----
        async function saveJsonToDrive(fileName, data) {
            const fileId = await findDriveFileId(fileName);
            const boundary = '-------gemini_chat_boundary';
            const metadata = fileId
                ? {}
                : { name: fileName, parents: ['appDataFolder'] };

            const body =
                `--${boundary}\r\n` +
                `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
                `${JSON.stringify(metadata)}\r\n` +
                `--${boundary}\r\n` +
                `Content-Type: application/json\r\n\r\n` +
                `${JSON.stringify(data)}\r\n` +
                `--${boundary}--`;

            const url = fileId
                ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
                : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

            const res = await fetch(url, {
                method: fileId ? 'PATCH' : 'POST',
                headers: {
                    Authorization: `Bearer ${googleAccessToken}`,
                    'Content-Type': `multipart/related; boundary=${boundary}`,
                },
                body,
            });

            if (!res.ok) throw new Error('Driveへの保存に失敗しました。');
            const result = await res.json();
            driveFileIds[fileName] = result.id;
        }

        // ====================================================
        // 【改善A】送信前の画像圧縮（長辺1600pxへ縮小＋JPEG再エンコード）
        // 【改善C】画像を送るのは「今回のターン」だけ（過去画像の再送を停止）
        // 【改善D】タイムアウト＋自動リトライの共通設定
        // ====================================================
        const IMAGE_MAX_SIDE = 1600;                 // 縮小後の長辺(px)
        const IMAGE_JPEG_QUALITY = 0.82;             // JPEG品質
        const IMAGE_MAX_BYTES = 3.5 * 1024 * 1024;   // これを超えたら品質を段階的に下げる
        const SEND_IMAGE_ONLY_IN_LATEST_TURN = true; // falseにすると従来どおり毎回すべての画像を送信します
        const REQUEST_TIMEOUT_MS = 300000;           // 1回あたりの制限時間（300秒＝5分）
        const RETRY_MAX = 2;                         // 失敗時に追加で再試行する回数
        const RETRY_BASE_DELAY_MS = 1000;            // 再試行前の待ち時間（1秒→2秒と倍に増やす）

        // 【改善A】画像ファイルを<img>経由で読み込む（EXIFの回転を保ったまま描画するため）
        function loadImageFromFile(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(img);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error("画像を読み込めませんでした。対応していない形式（HEICなど）か、ファイルが壊れている可能性があります。"));
                };
                img.src = url;
            });
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result));
                reader.onerror = () => reject(new Error("画像データの変換に失敗しました。"));
                reader.readAsDataURL(blob);
            });
        }

        // 【改善A】画像を縮小・再エンコードしてからBase64化する（送信量とメモリを大幅に削減）
        async function shrinkImage(file) {
            if (!file) return null;
            if (!/^image\//.test(file.type || "")) {
                throw new Error("画像ファイル（PNG / JPEG）を選択してください。");
            }

            const img = await loadImageFromFile(file);
            const srcW = img.naturalWidth || img.width;
            const srcH = img.naturalHeight || img.height;
            if (!srcW || !srcH) {
                throw new Error("画像サイズを取得できませんでした。別の画像でお試しください。");
            }

            const scale = Math.min(1, IMAGE_MAX_SIDE / Math.max(srcW, srcH));
            const width = Math.max(1, Math.round(srcW * scale));
            const height = Math.max(1, Math.round(srcH * scale));

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";   // 透過PNGをJPEG化したときの黒潰れを防ぐ
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            let blob = await new Promise((resolve, reject) => {
                canvas.toBlob(
                    (b) => (b ? resolve(b) : reject(new Error("画像の変換に失敗しました。"))),
                    "image/jpeg",
                    IMAGE_JPEG_QUALITY
                );
            });

            // まだ大きい場合は品質を段階的に落とす
            for (const quality of [0.7, 0.6, 0.5]) {
                if (blob.size <= IMAGE_MAX_BYTES) break;
                blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
            }

            const dataUrl = await blobToDataUrl(blob);

            return {
                base64: dataUrl.split(",")[1],
                mimeType: "image/jpeg",
                dataUrl: dataUrl,
                width: width,
                height: height,
                bytes: blob.size,
                originalBytes: file.size
            };
        }

        // 【改善C】過去ターンの画像(inlineData)を取り除き、直近のターンの画像だけを送る
        function sanitizeContentsForSend(contents) {
            const list = Array.isArray(contents) ? contents : [];
            if (!SEND_IMAGE_ONLY_IN_LATEST_TURN || list.length === 0) return list;

            const lastIndex = list.length - 1;
            return list.map((content, index) => {
                const parts = Array.isArray(content.parts) ? content.parts : [];
                const hasInlineData = parts.some((p) => p && p.inlineData);
                if (!hasInlineData || index === lastIndex) return content;

                const strippedParts = parts.filter((p) => !(p && p.inlineData));
                strippedParts.push({
                    text: "（以前に添付された画像は通信量削減のため省略しました。ここまでの会話の内容から文脈を判断してください。）"
                });

                return { role: content.role, parts: strippedParts };
            });
        }

        // 【改善D】再試行すべきエラーかどうかの判定
        function isRetryableError(error) {
            if (!error) return false;
            if (error.retryableHttp === true) return true;
            if (error.name === "AbortError" || error.name === "TimeoutError") return true;
            const message = String(error.message || "");
            return /load failed|failed to fetch|networkerror|network error|fetch failed|net::|ERR_/i.test(message);
        }

        function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        // --- Gemini API連携 ---
        function buildApiPayload() {
            const contents = currentMessages.map(msg => {
                let parts = [];
                if (msg.text) {
                    parts.push({ text: msg.text });
                }
                if (msg.imageUrl) {
                    const match = msg.imageUrl.match(/^data:(.*?);base64,(.*)$/);
                    if (match) {
                        parts.push({
                            inlineData: {
                                mimeType: match[1],
                                data: match[2]
                            }
                        });
                    }
                }
                return { role: msg.role, parts: parts };
            });

            return {
                systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                // 【改善C】過去ターンの画像は取り除き、直近のターンの画像だけを送る
                contents: sanitizeContentsForSend(contents),
                generationConfig: { temperature: 0.7 }
            };
        }

        // ====================================================
        // 【改善E】Geminiのストリーミング(SSE)受信エンジン
        // streamGenerateContent?alt=sse の ""data: {...}"" 行を逐次読み取り、
        // 受け取った分だけ本文を組み立ててコールバックします。
        // ====================================================

        // 受信中の本文描画（Markdownのみ。数式は完了時にまとめて描画して負荷を抑える）
        function streamRenderText(element, text) {
            if (!element) return;
            if (window.marked && typeof marked.parse === "function") {
                element.innerHTML = marked.parse(text);
            } else {
                element.textContent = text;
            }
        }

        // 完了時の数式描画（MathJaxが無い環境でもエラーにしない）
        function streamFinalizeMath(element) {
            if (!element || !window.MathJax || typeof MathJax.typesetPromise !== "function") {
                return Promise.resolve();
            }
            return MathJax.typesetPromise([element]).catch((err) => {
                console.warn("数式の描画に失敗しました:", err);
            });
        }

        // 1つのSSEイベント(JSON)から差分テキストを取り出す
        function extractDeltaText(json) {
            if (!json || typeof json !== "object") return "";

            // Interactions API（新しい形式: step.delta + delta.text）
            if (json.event_type === "step.delta" && json.delta &&
                json.delta.type === "text" && typeof json.delta.text === "string") {
                return json.delta.text;
            }

            // generateContent / streamGenerateContent（従来形式）
            const candidates = json.candidates;
            if (Array.isArray(candidates) && candidates.length > 0) {
                const content = candidates[0] && candidates[0].content;
                const parts = content && content.parts;
                if (Array.isArray(parts)) {
                    let text = "";
                    for (const part of parts) {
                        if (part && typeof part.text === "string") text += part.text;
                    }
                    return text;
                }
            }
            return "";
        }

        // 安全フィルタ等で途中終了していないかの確認
        function extractBlockedReason(json) {
            const candidates = json && json.candidates;
            if (Array.isArray(candidates) && candidates.length > 0) {
                const candidate = candidates[0];
                const reason = candidate && candidate.finishReason;
                if (reason && reason !== "STOP" && reason !== "MAX_TOKENS") return reason;
            }
            return null;
        }

        // レスポンス本文を読み切って、差分ごとに onDelta を呼ぶ
        async function readSseBody(response, onDelta, onAnyData) {
            let sawSse = false;
            let doneReading = false;
            let buffer = "";
            let rawAll = "";

            const handleLine = (line) => {
                const cleaned = line.replace(/\r$/, "").trim();
                if (!cleaned) return;

                // "event: ..." などの行は無視し、data: 行だけを対象にする
                if (!cleaned.startsWith("data:")) return;

                sawSse = true;
                const payload = cleaned.slice(5).trim();
                if (!payload) return;

                // ストリーム終端マーカー
                if (payload === "[DONE]") {
                    doneReading = true;
                    return;
                }

                let json = null;
                try {
                    json = JSON.parse(payload);
                } catch (e) {
                    return; // 途中で切れた行は捨てる
                }

                if (json && json.error) {
                    throw new Error(json.error.message || "ストリーミング中にAPIエラーが発生しました。");
                }

                if (typeof onAnyData === "function") onAnyData();

                const delta = extractDeltaText(json);
                if (delta) onDelta(delta);

                const blocked = extractBlockedReason(json);
                if (blocked) {
                    throw new Error(`回答が途中で終了しました（理由: ${blocked}）。問題文を変えるか、もう一度お試しください。`);
                }
            };

            // ReadableStream + TextDecoder（UTF-8のマルチバイトがチャンク境界で切れても壊れない）
            if (response.body && typeof response.body.getReader === "function" && typeof TextDecoder === "function") {
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                try {
                    while (!doneReading) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        rawAll += chunk;
                        buffer += chunk;

                        const lines = buffer.split("\n");
                        buffer = lines.pop(); // 未完了の行は次のチャンクへ持ち越す
                        for (const line of lines) handleLine(line);
                    }

                    // 端数（最後の改行なしの行）とデコーダの残りを処理する
                    if (!doneReading) {
                        const tail = decoder.decode();
                        if (tail) { rawAll += tail; buffer += tail; }
                        if (buffer.trim()) handleLine(buffer);
                    }
                } finally {
                    try { reader.releaseLock(); } catch (e) {}
                }
            } else {
                // ReadableStream非対応のブラウザ：まとめて受信してから解析する
                rawAll = await response.text();
                for (const line of rawAll.split("\n")) handleLine(line);
            }

            // data: 行が1つも無かった場合は、通常のJSON（またはJSON配列）として再解釈する
            if (!sawSse && rawAll.trim()) {
                let json = null;
                try {
                    json = JSON.parse(rawAll);
                } catch (e) {
                    json = null;
                }
                if (json) {
                    const items = Array.isArray(json) ? json : [json];
                    for (const item of items) {
                        const delta = extractDeltaText(item);
                        if (delta) {
                            if (typeof onAnyData === "function") onAnyData();
                            onDelta(delta);
                        }
                    }
                }
            }

            return rawAll;
        }

        // タイムアウト＋自動リトライ付きでストリーミング受信する
        async function streamGeminiRequest(url, body, onDelta, onRetry) {
            let lastError = null;
            let receivedText = "";

            for (let attempt = 0; attempt <= RETRY_MAX; attempt++) {
                if (attempt > 0 && typeof onRetry === "function") onRetry(attempt);

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
                let receivedAnyData = false;

                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "text/event-stream"
                        },
                        body: body,
                        signal: controller.signal
                    });

                    if (!response.ok) {
                        const rawErrorText = await response.text().catch(() => "");
                        let errorMsg = response.statusText;
                        try {
                            const parsed = rawErrorText ? JSON.parse(rawErrorText) : null;
                            errorMsg = (parsed && parsed.error && parsed.error.message) || errorMsg;
                        } catch (e) {}

                        if (response.status === 429) {
                            errorMsg = "APIの利用制限に達しました。左側のメニューから「Geminiのモデル名」を下のものに変更するか、少し時間を置いてから再度お試しください。";
                        } else if (response.status === 400 && /API key not valid/i.test(errorMsg)) {
                            errorMsg = "無効なAPIキーです。取得したキーが正しく貼り付けられているか確認してください。";
                        } else if (response.status === 413) {
                            errorMsg = "送信データが大きすぎます。画像を小さくするか、枚数を減らしてください。";
                        } else if (response.status === 404) {
                            errorMsg = "選択中のモデルが見つかりません。左側のメニューから別のモデルを選んでください。(" + errorMsg + ")";
                        }

                        const httpError = new Error(errorMsg);
                        // 一時的なエラー(429/408/5xx)のみ再試行する
                        httpError.retryableHttp = (response.status === 429 || response.status === 408 || response.status >= 500);
                        throw httpError;
                    }

                    await readSseBody(
                        response,
                        (delta) => {
                            receivedText += delta;
                            onDelta(receivedText);
                        },
                        () => { receivedAnyData = true; }
                    );

                    if (!receivedText.trim()) {
                        throw new Error("予期せぬレスポンス形式です。もう1度「この問題を解説させる」ボタンを押してみてください。");
                    }
                    return receivedText;

                } catch (error) {
                    lastError = error;

                    // すでに本文を受信し始めていた場合は、重複を避けるため再試行しない
                    if (receivedAnyData) {
                        if (error.name === "AbortError") {
                            throw new Error("受信中に" + Math.round(REQUEST_TIMEOUT_MS / 1000) + "秒を超えたため、処理をタイムアウト中断しました。");
                        }
                        throw error;
                    }

                    if (attempt < RETRY_MAX && isRetryableError(error)) {
                        console.warn(`通信に失敗したため再試行します (${attempt + 1}/${RETRY_MAX}): ${error.message}`);
                        await sleep(RETRY_BASE_DELAY_MS * Math.pow(2, attempt));
                        continue;
                    }

                    if (error.name === "AbortError") {
                        throw new Error(Math.round(REQUEST_TIMEOUT_MS / 1000) + "秒の制限時間を超えたため、処理をタイムアウト中断しました。");
                    }
                    throw error;

                } finally {
                    clearTimeout(timeoutId);
                }
            }

            throw lastError || new Error("通信に失敗しました。時間をおいて再度お試しください。");
        }

        // 【改善E】ストリーミング(SSE)で受け取り、受け取った分だけ画面に反映する
        async function callGeminiStream(onDelta, onRetry) {
            const apiKey = apiKeyInput.value.trim();
            const model = modelSelect.value;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${apiKey}`;
            const payload = buildApiPayload();
            return await streamGeminiRequest(url, JSON.stringify(payload), onDelta, onRetry);
        }

        chatInputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) { alert("APIキーを入力してください。"); return; }
            
            saveApiKeyToLocal(apiKey);

            const promptText = chatInput.value.trim();
            if (!promptText && !attachedImageData) return;

            initialInfo.style.display = 'none';

            const userMsg = {
                role: 'user',
                text: promptText,
                imageUrl: attachedImageData ? attachedImageData.dataUrl : null
            };
            currentMessages.push(userMsg);
            
            appendMessageToUI('user', promptText, userMsg.imageUrl, true);
            
            chatInput.value = '';
            chatInput.style.height = 'auto';
            removeAttachment();
            chatInput.disabled = true;
            chatSendBtn.disabled = true;

            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message assistant';
            loadingMsg.innerHTML = `<div class="avatar">✨</div><div class="message-content"><div class="spinner"></div> 生成中...</div>`;
            chatContainer.appendChild(loadingMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const model = modelSelect.value;
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                
                const payload = buildApiPayload();
                const body = JSON.stringify(payload);

                // 【改善E】受信しながら本文を描画するライブ表示
                const liveMsgDiv = document.createElement('div');
                liveMsgDiv.className = 'message assistant';
                liveMsgDiv.innerHTML = `<div class="avatar">✨</div><div class="message-content"><div class="spinner"></div> 生成中...</div>`;
                chatContainer.appendChild(liveMsgDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                const updateRetryNotice = (attempt) => {
                    const notice = `<div class="avatar">✨</div><div class="message-content"><div class="spinner"></div> 通信が不安定なため、自動で再試行しています（${attempt + 1}回目）...</div>`;
                    loadingMsg.innerHTML = notice;
                    liveMsgDiv.innerHTML = notice;
                };

                // ストリーミングで受信。うまくいかない場合は自動で通常リクエストに切り替える
                let responseText = '';
                let receivedPartial = false;
                try {
                    responseText = await callGeminiStream((currentText) => {
                        receivedPartial = true;
                        if (loadingMsg.style.display !== 'none') loadingMsg.style.display = 'none';
                        streamRenderText(liveMsgDiv.querySelector('.message-content'), currentText);
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }, updateRetryNotice);
                } catch (streamError) {
                    liveMsgDiv.remove();
                    loadingMsg.style.display = '';

                    // 途中まで表示していた場合は重複を避けるため、そのままエラーとして扱う
                    if (receivedPartial) throw streamError;

                    console.warn('ストリーミング受信に失敗したため、通常のリクエストに切り替えます:', streamError);
                    const result = await fetchWithTimeoutAndRetry(url, body, updateRetryNotice);
                    const fallbackResponse = result.response;
                    const fallbackData = result.data;

                    if (!fallbackResponse.ok) {
                        let errorMsg = (fallbackData.error && fallbackData.error.message) || fallbackResponse.statusText;
                        if (fallbackResponse.status === 429) errorMsg = "APIの利用制限に達しました。時間をおいてお試しください。";
                        else if (fallbackResponse.status === 400 && errorMsg.includes("API key not valid")) errorMsg = "無効なAPIキーです。";
                        else if (fallbackResponse.status === 413) errorMsg = "送信データが大きすぎます。画像を小さくするか、枚数を減らしてください。";
                        throw new Error(errorMsg);
                    }

                    const fallbackCandidates = fallbackData.candidates;
                    if (fallbackCandidates && fallbackCandidates[0] && fallbackCandidates[0].content && fallbackCandidates[0].content.parts) {
                        responseText = fallbackCandidates[0].content.parts[0].text;
                    } else {
                        throw new Error("予期せぬレスポンス形式です。");
                    }
                }

                if (liveMsgDiv.parentNode) liveMsgDiv.remove();
                if (loadingMsg.parentNode) chatContainer.removeChild(loadingMsg);

                currentMessages.push({ role: 'model', text: responseText, imageUrl: null });
                appendMessageToUI('assistant', responseText, null, true);

                saveCurrentSession();

            } catch (error) {
                if (liveMsgDiv.parentNode) liveMsgDiv.remove();
                if (loadingMsg.parentNode) chatContainer.removeChild(loadingMsg);
                showError(error.message);
                currentMessages.pop(); 
            } finally {
                chatInput.disabled = false;
                checkInputState();
                chatInput.focus();
            }
        });
    </script>
